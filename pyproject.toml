[project]
name = "del-maintops-copilot"
version = "0.1.0"
description = "Del-MaintOps Copilot: Generative AI-Driven Facility Recommendation & Decision Support System for FITE IT Del"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kelompok Del-MaintOps Copilot" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Dependensi berikut akan ditambahkan progresif di Milestone 2-5:
# google-genai, chromadb, sentence-transformers, gradio, fastmcp, opencv-python, pydantic

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
