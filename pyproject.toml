[project]
name = "del-maintops-copilot"
version = "0.1.0"
description = "Del-MaintOps Copilot: Generative AI-Driven Facility Recommendation & Decision Support System for FITE IT Del"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kelompok Del-MaintOps Copilot" }
]
dependencies = [
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
